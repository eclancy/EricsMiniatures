# Reverse proxy for ericsminiatures.com.
#
# nginx serves the built client directly (fastest path for static files) and
# forwards the API and image routes to the Node service on port 4000.
#
# Install to /etc/nginx/sites-available/ericsminiatures.com and symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
# Replace REPLACE_ME_USER with the deploy user.

server {
    listen 80;
    listen [::]:80;
    server_name ericsminiatures.com www.ericsminiatures.com;

    # certbot will rewrite this block to add TLS and a redirect.

    root /home/REPLACE_ME_USER/ericsminiatures.com/build;
    index index.html;

    # Images can be large; allow generous timeouts on a cold cache.
    client_max_body_size 4m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted client assets never change under the same name.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Image derivatives: proxied to Node, cached hard by the browser.
    location /media/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold-cache AVIF encode of a large photo can take a few seconds.
        proxy_read_timeout 60s;
        # Node already sets Cache-Control and ETag; do not override them.
        proxy_buffering on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
